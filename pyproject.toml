[project]
name = "tavle"
version = "0.1.0"
requires-python = ">=3.14"
license = "MIT"
dependencies = []

[project.scripts]
tavle = "tavle.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tavle"
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-timeout>=2.3,<3",
    "pytest-xdist>=3.6,<4",
    "mollify>=0.2.2,<0.3",
    "ruff",
    "pyright[nodejs]",
    "playwright>=1.50,<2",
    "import-linter>=2.17",
]

[tool.pytest.ini_options]
timeout = 300
timeout_method = "thread"
markers = ["slow: integration, stress, scale, browser, or full-matrix test"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["src", "tests", "scripts"]
exclude = ["**/node_modules", "**/tests/**/fixtures/**"]

[tool.ruff]
target-version = "py314"
extend-exclude = ["openspec/**", "**/tests/**/fixtures/**", "**/tests/**/golden/**", "**/tests/**/goldens/**"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "C4", "TC", "C90", "PLR", "RUF100", "RET", "FURB", "PLW", "PERF", "S", "E", "TRY"]
ignore = ["PLR2004", "TC001", "TC002", "TC003", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 19

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 18
max-returns = 8
max-statements = 53

[tool.importlinter]
root_package = "tavle"

[[tool.importlinter.contracts]]
name = "Tavle layers"
type = "layers"
layers = [
    "tavle.cli",
    "tavle.serve | tavle.listings",
    "tavle.comments",
    "tavle.page",
    "tavle.blocks_render",
    "tavle.blocks",
    "tavle.theme",
    "tavle.lines",
]
