:root, :host {

  --vd-neutral-muted: hsl(0 0% 45%);
  --vd-line: hsl(0 0% 90%);

  --vd-info: #0b5fd6;
  --vd-info-subtle: rgba(11, 95, 214, 0.12);
  --vd-success: #2e7d32;
  --vd-success-subtle: rgba(46, 125, 50, 0.08);
  --vd-warning: #8a5a00;
  --vd-warning-subtle: rgba(198, 120, 0, 0.14);
  --vd-danger: #c62828;
  --vd-danger-subtle: rgba(198, 40, 40, 0.12);

  --vd-series-2: #c67800;
  --vd-series-3: #8e24aa;

(() => {
const components = {};
components["annotated-code"] = (() => {
// Annotated code: the code panel plus numbered notes anchored to line ranges. Pins and notes
// link by plain href; quiet stretches fold into a native <details>. Props: the code props plus
// uid, columns, folds ([from, to] runs), copy and notes (number, start, end, label, text, kind,
// glyph, word, tone, where).
function pin(m, uid, note) {
  const name = `Note ${note.number}, ${note.word.toLowerCase()}, ${note.where}`;
  return m('a', {
    class: `vd-annotated-pin vd-annotated-k-${note.kind}`,
    id: `pin-${uid}-${note.number}`,
    href: `#note-${uid}-${note.number}`,
    'aria-label': name
  }, String(note.number));
}

function foldRow(m, first, last) {
  return m('summary.vd-annotated-fold-row', [
    m('span.vd-annotated-fold-closed', `${last - first + 1} lines hidden (lines ${first}-${last})`),
    m('span.vd-annotated-fold-open', `Hide lines ${first}-${last}`)
  ]);
}

function noteItem(m, c, uid, note) {
  return m('li', {
    class: `vd-annotated-note vd-annotated-t-${note.tone}`,
    id: `note-${uid}-${note.number}`,
    tabindex: '-1',
    'data-from': String(note.start),
    'data-to': String(note.end)
  }, [
    m('a.vd-annotated-back', { href: `#pin-${uid}-${note.number}`, 'aria-label': `Note ${note.number}: back to ${note.where}` }, String(note.number)),
    m('div.vd-annotated-body', [
      m('p.vd-annotated-meta', [m('span.vd-annotated-glyph', { 'aria-hidden': 'true' }, note.glyph), ` ${note.word} · ${note.where}`]),
      note.label ? m('span.vd-annotated-label', note.label) : null,
      m('p.vd-annotated-text', c.shared.inline(m, note.text))
    ])
  ]);
}

function arrangeFolds(m, folds) {
  const startAt = new Map(folds.map(([from, to]) => [from, [from, to]]));
  return (items) => {
    const out = [];
    let group = null;
    let closing = 0;
    for (const { number, node } of items) {
      if (startAt.has(number)) {
        const [from, to] = startAt.get(number);
        group = { summary: foldRow(m, from, to), nodes: [] };
        closing = to;
      }
      if (group) group.nodes.push(node);
      else out.push(node);
      if (group && number === closing) {
        out.push(m('details.vd-annotated-fold', [group.summary, group.nodes]));
        group = null;
        closing = 0;
      }
    }
    return out;
  };
}

function view(m, props, c) {
  const code = c.code;
  if (!props.notes.length) return code.panel(m, props, { cls: 'vb annotated-code' });
  const pinsAt = new Map();
  for (const note of props.notes) {
    if (!pinsAt.has(note.start)) pinsAt.set(note.start, []);
    pinsAt.get(note.start).push(pin(m, props.uid, note));
  }
  const line = (number, tokens, marked) => {
    const pins = pinsAt.get(number);
    const attrs = { class: pins ? 'vd-code-line vd-annotated-pinned' : 'vd-code-line', 'data-line': String(number) };
    if (marked) attrs['data-mark'] = '1';
    return m('span', attrs, [pins ? m('span.vd-annotated-pins', pins) : null, code.tokenNodes(m, tokens), '\n']);
  };
  const figure = code.panel(m, props, { cls: '', line, arrange: arrangeFolds(m, props.folds) });
  return m('div', { class: `vb annotated-code vd-annotated-code vd-annotated-c${props.columns}`, 'data-copy': props.copy }, [
    figure,
    m('ol.vd-annotated-notes', { 'aria-label': `Notes on ${props.title}` }, props.notes.map((note) => noteItem(m, c, props.uid, note)))
  ]);
}

return { view };
})();
components["callout"] = (() => {
// Callout block as a component. Same DOM as blocks_render/callout.py.
// A component file has no imports: it exports `view(m, props, components)` and may export helpers;
// `components.shared` holds the helpers blocks have in common.
const TONES = {
  info: ['i', 'Info'],
  decision: ['◆', 'Decision'],
  risk: ['▲', 'Risk'],
  warning: ['!', 'Warning'],
  success: ['✓', 'Success']
};

function copyText(props) {
  return [props.title, props.text].filter((part) => part).join('\n');
}

function view(m, props, c) {
  const [glyph, word] = TONES[props.tone];
  const paragraphs = props.text.split(/\n\s*\n/).filter((p) => p.trim());
  return m(`aside.vb.callout.vd-callout.vd-callout-${props.tone}`, { 'data-copy': copyText(props) }, [
    m('p.vd-callout-label', [m('span.vd-callout-glyph', { 'aria-hidden': 'true' }, glyph), ` ${word}`]),
    props.title === undefined ? null : m('p.vd-callout-title', props.title),
    paragraphs.map((p) => m('p.vd-callout-text', c.shared.inline(m, p.trim())))
  ]);
}

return { copyText, view };
})();
components["change-summary"] = (() => {
// Change summary: an info-toned panel holding one sentence (`text`, filled by the page).
function view(m, props) {
  const title = props.title || '';
  const copy = [title, props.text].filter((part) => part).join('\n');
  return m('aside.vb.change-summary.vd-change-summary', { 'aria-label': 'Change summary', 'data-copy': copy }, [
    m('p.vd-change-summary-label', [m('span.vd-change-summary-glyph', { 'aria-hidden': 'true' }, '~'), ' Changes']),
    title ? m('p.vd-change-summary-title', title) : null,
    m('p.vb-alt.vd-change-summary-text', props.text)
  ]);
}

return { view };
})();
components["chart"] = (() => {
// Chart: an SVG the server drew (props.shapes), a legend, the events list and a data table.
// Props: heading, kind, title, desc, dense, box, shapes, legend ({n, class, marker, dash, name, key}),
// events ({n, label, kind, where, tone, class}), notes (text), table ({head, rows}), copy.
// static/chart.js adds the tooltip, readout, legend toggles and keyboard reading on the mounted DOM.
function legend(m, c, items) {
  if (!items.length) return null;
  return m('ul.vb-legend', items.map((item) => m('li', {
    class: item.class,
    'data-series': String(item.n),
    'data-marker': item.marker,
    'data-dash': item.dash
  }, [
    m('svg.vb-key', { viewBox: '0 0 28 14', 'aria-hidden': 'true', focusable: 'false' }, c.shared.scene(m, item.key)),
    m('span.vb-name', item.name)
  ])));
}

function eventsList(m, events) {
  if (!events.length) return null;
  return [
    m('h5.vb-events-title', 'Events'),
    m('ol.vb-events', events.map((e) => m('li', {
      class: e.class,
      'data-event': String(e.n),
      'data-kind': e.kind,
      'data-where': e.where,
      'data-tone': e.tone
    }, [
      m('span.vb-ev-num', String(e.n)),
      m('span.vb-ev-label', e.label),
      ' ',
      m('span.vb-ev-meta', `(${e.kind}, ${e.where}, ${e.tone})`)
    ])))
  ];

// Matrix block as a component: a typed table of options by criteria, with the
// recommended column marked, level ratings toned and a weighted total.
const SCALES = {
  verdict: { yes: 2, partial: 1, no: 0 },
  level: { high: 2, medium: 1, low: 0 }
};
const FIRST_COLUMN = 'Criterion';
const TOTAL_LABEL = 'Weighted total';
const NOT_RATED = 'Not rated';
const LEVEL_TONES = { high: ['ok', '✓'], medium: ['warn', '▲'], low: ['bad', '✕'] };

function ratingScale(cell) {
  const word = typeof cell === 'string' ? cell.trim().toLowerCase() : '';
  return Object.keys(SCALES).find((name) => Object.hasOwn(SCALES[name], word)) || null;
}

function scaleOf(cells) {
  return cells.flat().map(ratingScale).find((scale) => scale) || 'verdict';
}

function points(cell, scale) {
  const word = String(cell).trim().toLowerCase();
  return Object.hasOwn(SCALES[scale], word) ? SCALES[scale][word] : 0;
}

// (score, best possible) per option column.
function totals(cells, weights, scale) {
  const best = 2 * weights.reduce((a, b) => a + b, 0);
  const width = cells.length ? cells[0].length : 0;
  return Array.from({ length: width }, (_, i) => [cells.reduce((sum, row, n) => sum + weights[n] * points(row[i], scale), 0), best]);
}

// The text alternative: sizes, the recommendation and the scoring rule.
function alternative(c, props, options, criteria, weighted) {
  const parts = [`${c.shared.countNoun(options.length, 'option', 'options')} compared on ${c.shared.countNoun(criteria.length, 'criterion', 'criteria')}.`];
  const chosen = options.find((o) => o.id === props.recommended);
  if (chosen) parts.push(`Recommended: ${chosen.label}.`);
  if (weighted) parts.push('Weighted total: yes or high scores 2, partial or medium 1, no or low 0, times the weight.');
  return parts.join(' ');
}

// The table block props the matrix is shown with.
function tableProps(c, props, options, criteria, cells) {
  const weighted = criteria.some((criterion) => 'weight' in criterion);
  const rows = criteria.map((criterion, n) => [
    criterion.label + ('weight' in criterion ? ` (weight ${criterion.weight})` : ''),
    ...cells[n].map((cell) => String(cell).trim() || NOT_RATED)
  ]);
  if (weighted) {
    const weights = criteria.map((criterion) => Number(criterion.weight ?? 1));
    rows.push([TOTAL_LABEL, ...totals(cells, weights, scaleOf(cells)).map(([got, best]) => `${got} of ${best}`)]);
  }
  const labels = options.map((o) => String(o.label));

    caption: String(props.title ?? 'Options compared'),
    columns: [FIRST_COLUMN, ...labels],
    rows,
    types: Object.fromEntries(labels.map((label) => [label, 'status'])),
    footnote: alternative(c, props, options, criteria, weighted),
    stack: true
  };
}

function copyText(c, table, recommended) {
  const columns = table.columns.map((col) => (col === recommended ? `${col} (recommended)` : col));
  const lines = [columns, columns.map(() => '---'), ...table.rows];
  return lines.map((line) => `| ${line.map((cell) => c.shared.words(String(cell)).replaceAll('|', '\\|')).join(' | ')} |`).join('\n');
}

function notes(m, options) {
  const items = options.filter((o) => 'note' in o);

function levelTone(text) {
  const word = text.toLowerCase();

  const cells = (Array.isArray(props.cells) ? props.cells : []).map((row) => (Array.isArray(row) ? row : []));

// Recap block as a component: `varde learn docs recap --json` output as changes and drift.
// static/recap.js wires the judgment buttons by class and `data-item`.
const VERDICTS = { accepted: 'Accept', rejected: 'Reject', open: 'Open' };
const RANGES = [['+', 'added'], ['-', 'removed']];

const list = (value) => (Array.isArray(value) ? value : []);
const dict = (value) => (value !== null && typeof value === 'object' && !Array.isArray(value) ? value : {});
const rowsOf = (props) => list(props.rows).map(dict);
const anchor = (prefix, index) => `${prefix}-f${index}`;

// [item key, label] for each drift flag, in a stable order.
function driftItems(props) {
  const items = rowsOf(props)

    .map((row) => [`unplanned:${row.file}`, `unplanned change: ${row.file}`]);
  for (const raw of list(props.untouched)) {
    const { task = '', owns = '' } = dict(raw);
    items.push([`untouched:${task}:${owns}`, `untouched: ${task} owns ${owns}`]);
  }
  for (const block of list(props.unverified)) items.push([`unverified:${block}`, `unverified block: ${block}`]);
  return items;
}

function mapping(m, props, prefix) {
  const byBlock = new Map();
  rowsOf(props).forEach((row, index) => {
    for (const block of list(row.blocks)) {
      const links = byBlock.get(String(block)) || [];
      links.push(m('a', { href: `#${anchor(prefix, index)}` }, row.file));
      byBlock.set(String(block), links);
    }
  });
  const rows = [...byBlock].sort(([a], [b]) => (a < b ? -1 : a > b ? 1 : 0)).map(([block, links]) => [block, links.flatMap((link, i) => (i ? [', ', link] : [link]))]);
  for (const block of list(props.unverified)) {
    if (!byBlock.has(String(block))) rows.push([String(block), 'no changed file']);
  }
  if (!rows.length) return m('p', 'No plan block is linked to a change.');
  return m('table.vb-table', [
    m('thead', m('tr', [m('th', 'Plan block'), m('th', 'Changed files')])),
    m('tbody', rows.map(([block, cell]) => m('tr', [m('td', block), m('td', cell)])))
  ]);
}

function drift(m, props) {
  const items = driftItems(props);
  if (!items.length) return m('p', 'No drift flagged.');
  const buttons = Object.entries(VERDICTS).map(([verdict, label]) => m('button.recap-verdict', { type: 'button', 'data-verdict': verdict }, label));

    m('ul.recap-drift', items.map(([key, label]) => m('li.recap-item', { 'data-item': key }, [`${label} `, m('span.recap-buttons', buttons), m('span.recap-state', { 'aria-live': 'polite' })]))),
    m('p.recap-error', { role: 'alert' })
  ];

function ranges(m, c, prefix, index, row) {
  const links = [];
  for (const [sign, key] of RANGES) {
    for (const pair of list(row[key])) {
      if (!(Array.isArray(pair) && pair.length === 2)) continue;
      const name = `${anchor(prefix, index)}-${key[0]}${pair[0]}-${pair[1]}`;
      links.push(m('a.recap-range', { id: name, href: `#${name}` }, `${sign}${pair[0]}-${pair[1]}`));
    }
  }

// Risks block as a component: a 3x3 likelihood-by-impact grid and the full risk list.
const LEVELS = ['low', 'medium', 'high'];

const SEVERITIES = ['low', 'medium', 'high', 'critical'];
const GLYPHS = { low: '○', medium: '◐', high: '▲', critical: '◆' };
const WORDS = { low: 'Low', medium: 'Medium', high: 'High', critical: 'Critical' };
const CHIPS_PER_CELL = 4;
const OPTIONAL = ['mitigation', 'owner'];

// Likelihood x impact (1 to 9): 1-2 low, 3-4 medium, 6 high, 9 critical.
function severityOf(likelihood, impact) {
  const score = SCORE[likelihood] * SCORE[impact];
  if (score <= 2) return 'low';
  if (score <= 4) return 'medium';
  return score <= 6 ? 'high' : 'critical';
}
