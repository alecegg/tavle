name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.19
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: uv tool install rust-just==1.59.0
      - run: uv tool dir --bin >> "$GITHUB_PATH"
      - run: uv sync --locked
      - run: npm ci
      - run: just test
